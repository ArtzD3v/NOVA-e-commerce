<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra — Nova Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#d4a017', light: '#fcd34d', dark: '#b4860b' },
                        accent: { DEFAULT: '#facc15', light: '#fef08a' },
                        success: '#10b981',
                        dark: '#0a0a0a',
                        card: { DEFAULT: '#171717', hover: '#262626' },
                        text: { primary: '#f8fafc', secondary: '#cbd5e1', muted: '#64748b' },
                        glass: { border: 'rgba(212, 160, 23, 0.15)' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-primary': 'linear-gradient(135deg, #d4a017, #fcd34d, #b4860b)',
                        'gradient-accent': 'linear-gradient(135deg, #fef08a, #facc15)',
                    },
                    boxShadow: {
                        'glow': '0 0 40px rgba(212, 160, 23, 0.15)',
                        'card': '0 4px 24px rgba(0, 0, 0, 0.5)',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-[#1e293b]/80 backdrop-blur-xl border border-white/10;
            }

            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-primary;
            }

            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #0f172a;
            }

            ::-webkit-scrollbar-thumb {
                background: #d4a017;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #fcd34d;
            }
        }
    </style>
</head>

<body class="bg-dark text-text-primary font-sans antialiased min-h-screen overflow-x-hidden selection:bg-primary/30"
    data-page="checkout">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-[1000] glass-panel transition-all duration-300 bg-dark/95 shadow-[0_4px_30px_rgba(0,0,0,0.3)]"
        id="navbar">
        <div class="max-w-[1400px] mx-auto px-6 h-[72px] flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5 text-2xl font-extrabold tracking-tight">
                <div class="w-10 h-10 bg-gradient-primary text-black rounded-lg flex items-center justify-center text-xl">
                    <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                </div>
                <span class="text-gradient">NOVA Checkout</span>
            </a>

            <div class="font-semibold text-sm text-success flex items-center gap-2">
                <i data-lucide="shield-check" class="w-5 h-5"></i> Pagamento 100% Seguro
            </div>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto px-6 pt-[120px] pb-[60px]">
        <div class="flex flex-col lg:flex-row gap-10 items-start">

            <!-- Form -->
            <form class="flex-1 w-full" id="checkout-form">

                <div class="bg-card border border-glass-border rounded-2xl p-6 sm:p-8 mb-6 shadow-card">
                    <h3 class="text-xl font-bold mb-6 pb-4 border-b border-glass-border">1. Seus Dados</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="col-span-1 sm:col-span-2 flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">Nome Completo</label>
                            <input type="text" name="name" required placeholder="João da Silva"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">E-mail</label>
                            <input type="email" name="email" required placeholder="joao@email.com"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">Telefone</label>
                            <input type="tel" name="phone" required placeholder="(11) 99999-9999"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted">
                        </div>
                    </div>
                </div>

                <div class="bg-card border border-glass-border rounded-2xl p-6 sm:p-8 mb-6 shadow-card">
                    <h3 class="text-xl font-bold mb-6 pb-4 border-b border-glass-border">2. Endereço de Entrega</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">CEP</label>
                            <input type="text" name="zip" required placeholder="00000-000"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted">
                        </div>
                        <div class="col-span-1 sm:col-span-2 flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">Endereço</label>
                            <input type="text" name="address" required placeholder="Rua das Flores, 123"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">Cidade</label>
                            <input type="text" name="city" required placeholder="São Paulo"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">Estado</label>
                            <div class="relative">
                                <select name="state" required
                                    class="w-full bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all appearance-none cursor-pointer">
                                    <option value="SP">São Paulo (SP)</option>
                                    <option value="RJ">Rio de Janeiro (RJ)</option>
                                    <option value="MG">Minas Gerais (MG)</option>
                                </select>
                                <div
                                    class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-text-muted">
                                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-card border border-glass-border rounded-2xl p-6 sm:p-8 mb-8 shadow-card">
                    <h3 class="text-xl font-bold mb-6 pb-4 border-b border-glass-border">3. Forma de Pagamento</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="col-span-1 sm:col-span-2">
                            <label
                                class="flex items-center gap-3 p-4 bg-primary/10 border border-primary rounded-lg cursor-pointer hover:bg-primary/20 transition-colors">
                                <input type="radio" name="payment-method" value="card" checked
                                    class="w-4 h-4 text-primary bg-dark border-glass-border focus:ring-primary focus:ring-2 cursor-pointer">
                                <span class="flex-1 font-semibold text-text-primary">Cartão de Crédito</span>
                                <i data-lucide="credit-card" class="w-6 h-6 text-text-secondary"></i>
                            </label>
                        </div>

                        <div class="col-span-1 sm:col-span-2 flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">Número do Cartão</label>
                            <input type="text" required placeholder="0000 0000 0000 0000" maxlength="19"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted tracking-wider">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">Validade</label>
                            <input type="text" required placeholder="MM/AA" maxlength="5"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted">
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-semibold text-text-secondary">CVV</label>
                            <input type="text" required placeholder="123" maxlength="4"
                                class="bg-dark border border-glass-border rounded-lg px-4 py-3 text-text-primary text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-text-muted">
                        </div>
                    </div>
                </div>

                <button type="submit"
                    class="w-full inline-flex items-center justify-center gap-2 py-4 px-9 text-lg font-semibold rounded-xl bg-gradient-primary text-white shadow-[0_4px_15px_rgba(99,102,241,0.3)] hover:-translate-y-0.5 hover:shadow-[0_8px_25px_rgba(99,102,241,0.4)] transition-all duration-300">
                    Finalizar Pedido Seguramente
                </button>
            </form>

            <!-- Summary -->
            <div class="w-full lg:w-[380px] shrink-0 sticky top-[100px]" id="checkout-summary">
                <!-- Rendered by JS -->
            </div>

        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
