<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe do Produto — Nova Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#d4a017', light: '#fcd34d', dark: '#b4860b' },
                        accent: { DEFAULT: '#facc15', light: '#fef08a' },
                        dark: '#0a0a0a',
                        card: { DEFAULT: '#171717', hover: '#262626' },
                        text: { primary: '#f8fafc', secondary: '#cbd5e1', muted: '#64748b' },
                        glass: { border: 'rgba(212, 160, 23, 0.15)' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-primary': 'linear-gradient(135deg, #d4a017, #fcd34d, #b4860b)',
                        'gradient-accent': 'linear-gradient(135deg, #fef08a, #facc15)',
                    },
                    boxShadow: {
                        'glow': '0 0 40px rgba(212, 160, 23, 0.15)',
                        'card': '0 4px 24px rgba(0, 0, 0, 0.5)',
                    },
                    animation: {
                        'badgePop': 'badgePop 0.3s ease',
                    },
                    keyframes: {
                        badgePop: {
                            '0%': { transform: 'scale(0)' },
                            '50%': { transform: 'scale(1.3)' },
                            '100%': { transform: 'scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-[#1e293b]/80 backdrop-blur-xl border border-white/10;
            }

            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-primary;
            }

            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #0f172a;
            }

            ::-webkit-scrollbar-thumb {
                background: #d4a017;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #fcd34d;
            }
        }
    </style>
</head>

<body class="bg-dark text-text-primary font-sans antialiased min-h-screen overflow-x-hidden selection:bg-primary/30"
    data-page="product-detail">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-[1000] glass-panel transition-all duration-300 bg-dark/95 shadow-[0_4px_30px_rgba(0,0,0,0.3)]"
        id="navbar">
        <div class="max-w-[1400px] mx-auto px-6 h-[72px] flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5 text-2xl font-extrabold tracking-tight">
                <div class="w-10 h-10 bg-gradient-primary text-black rounded-lg flex items-center justify-center text-xl">
                    <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                </div>
                <span class="text-gradient">NOVA</span>
            </a>

            <ul class="hidden lg:flex items-center gap-8">
                <li><a href="index.html"
                        class="text-sm font-medium text-text-secondary hover:text-text-primary relative py-1 after:absolute after:bottom-[-2px] after:left-0 after:w-0 after:h-[2px] after:bg-gradient-primary after:rounded-full after:transition-all hover:after:w-full">Home</a>
                </li>
                <li><a href="products.html"
                        class="text-sm font-medium text-text-primary relative py-1 after:absolute after:bottom-[-2px] after:left-0 after:w-full after:h-[2px] after:bg-gradient-primary after:rounded-full">Produtos</a>
                </li>
            </ul>

            <div class="flex items-center gap-4">
                <button
                    class="w-[42px] h-[42px] flex items-center justify-center bg-card border border-glass-border rounded-full text-text-secondary text-lg hover:bg-card-hover hover:text-text-primary hover:border-primary transition-colors"
                    id="auth-btn" title="Conta">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </button>

                <a href="cart.html"
                    class="relative w-[42px] h-[42px] flex items-center justify-center bg-card border border-glass-border rounded-full text-text-secondary text-lg hover:bg-card-hover hover:text-text-primary hover:border-primary transition-colors"
                    title="Carrinho">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span
                        class="absolute -top-1 -right-1 bg-gradient-accent text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center animate-badgePop shadow-lg"
                        id="cart-badge" style="display:none">0</span>
                </a>

                <div class="lg:hidden flex flex-col gap-[5px] cursor-pointer p-1" id="nav-toggle">
                    <span class="w-6 h-0.5 bg-text-primary rounded-full transition-transform"></span>
                    <span class="w-6 h-0.5 bg-text-primary rounded-full transition-opacity"></span>
                    <span class="w-6 h-0.5 bg-text-primary rounded-full transition-transform"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="product-detail" class="max-w-[1400px] mx-auto px-6 pt-[120px] pb-[60px] min-h-[calc(100vh-400px)]">
        <!-- Rendered by JS -->
    </main>

    <!-- Related Products -->
    <section class="max-w-[1400px] mx-auto px-6 pb-[100px]">
        <div class="mb-8">
            <h2 class="text-2xl font-extrabold tracking-tight">Produtos Relacionados</h2>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="related-products">
            <!-- Rendered by JS -->
        </div>
    </section>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
