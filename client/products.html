<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos — Nova Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#d4a017', light: '#fcd34d', dark: '#b4860b' },
                        accent: { DEFAULT: '#facc15', light: '#fef08a' },
                        dark: '#0a0a0a',
                        card: { DEFAULT: '#171717', hover: '#262626' },
                        text: { primary: '#f8fafc', secondary: '#cbd5e1', muted: '#64748b' },
                        glass: { border: 'rgba(212, 160, 23, 0.15)' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-primary': 'linear-gradient(135deg, #d4a017, #fcd34d, #b4860b)',
                        'gradient-accent': 'linear-gradient(135deg, #fef08a, #facc15)',
                        'gradient-hero': 'linear-gradient(135deg, #0a0a0a 0%, #171717 50%, #0a0a0a 100%)',
                    },
                    boxShadow: {
                        'glow': '0 0 40px rgba(212, 160, 23, 0.15)',
                        'card': '0 4px 24px rgba(0, 0, 0, 0.5)',
                    },
                    animation: {
                        'badgePop': 'badgePop 0.3s ease',
                    },
                    keyframes: {
                        badgePop: {
                            '0%': { transform: 'scale(0)' },
                            '50%': { transform: 'scale(1.3)' },
                            '100%': { transform: 'scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-[#1e293b]/80 backdrop-blur-xl border border-white/10;
            }

            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-primary;
            }

            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #0f172a;
            }

            ::-webkit-scrollbar-thumb {
                background: #d4a017;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #fcd34d;
            }
        }
    </style>
</head>

<body class="bg-dark text-text-primary font-sans antialiased min-h-screen overflow-x-hidden selection:bg-primary/30"
    data-page="products">

    <!-- ═══ Navbar ═══ -->
    <nav class="fixed top-0 left-0 right-0 z-[1000] glass-panel transition-all duration-300" id="navbar">
        <div class="max-w-[1400px] mx-auto px-6 h-[72px] flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5 text-2xl font-extrabold tracking-tight">
                <div class="w-10 h-10 bg-gradient-primary text-black rounded-lg flex items-center justify-center text-xl">
                    <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                </div>
                <span class="text-gradient">NOVA</span>
            </a>

            <ul class="hidden lg:flex items-center gap-8">
                <li><a href="index.html"
                        class="text-sm font-medium text-text-secondary hover:text-text-primary relative py-1 after:absolute after:bottom-[-2px] after:left-0 after:w-0 after:h-[2px] after:bg-gradient-primary after:rounded-full after:transition-all hover:after:w-full">Home</a>
                </li>
                <li><a href="products.html"
                        class="text-sm font-medium text-text-primary relative py-1 after:absolute after:bottom-[-2px] after:left-0 after:w-full after:h-[2px] after:bg-gradient-primary after:rounded-full">Produtos</a>
                </li>
                <li><a href="products.html?category=Eletr%C3%B4nicos"
                        class="text-sm font-medium text-text-secondary hover:text-text-primary relative py-1 after:absolute after:bottom-[-2px] after:left-0 after:w-0 after:h-[2px] after:bg-gradient-primary after:rounded-full after:transition-all hover:after:w-full">Eletrônicos</a>
                </li>
                <li><a href="products.html?category=Moda"
                        class="text-sm font-medium text-text-secondary hover:text-text-primary relative py-1 after:absolute after:bottom-[-2px] after:left-0 after:w-0 after:h-[2px] after:bg-gradient-primary after:rounded-full after:transition-all hover:after:w-full">Moda</a>
                </li>
                <li><a href="products.html?category=Esportes"
                        class="text-sm font-medium text-text-secondary hover:text-text-primary relative py-1 after:absolute after:bottom-[-2px] after:left-0 after:w-0 after:h-[2px] after:bg-gradient-primary after:rounded-full after:transition-all hover:after:w-full">Esportes</a>
                </li>
            </ul>

            <div class="flex items-center gap-4">
                <div class="relative hidden sm:block group">
                    <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-text-muted w-4 h-4 z-10"></i>
                    <input type="text" placeholder="Buscar produtos..." id="global-search"
                        class="bg-card border border-glass-border rounded-full py-2.5 px-4 pl-10 text-text-primary text-sm w-[220px] transition-all duration-300 focus:w-[280px] focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none placeholder:text-text-muted group-hover:border-primary/50">
                </div>

                <button
                    class="w-[42px] h-[42px] flex items-center justify-center bg-card border border-glass-border rounded-full text-text-secondary text-lg hover:bg-card-hover hover:text-text-primary hover:border-primary transition-colors"
                    id="auth-btn" title="Conta">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </button>

                <a href="cart.html"
                    class="relative w-[42px] h-[42px] flex items-center justify-center bg-card border border-glass-border rounded-full text-text-secondary text-lg hover:bg-card-hover hover:text-text-primary hover:border-primary transition-colors"
                    title="Carrinho">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span
                        class="absolute -top-1 -right-1 bg-gradient-accent text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center animate-badgePop shadow-lg"
                        id="cart-badge" style="display:none">0</span>
                </a>

                <div class="lg:hidden flex flex-col gap-[5px] cursor-pointer p-1" id="nav-toggle">
                    <span class="w-6 h-0.5 bg-text-primary rounded-full transition-transform"></span>
                    <span class="w-6 h-0.5 bg-text-primary rounded-full transition-opacity"></span>
                    <span class="w-6 h-0.5 bg-text-primary rounded-full transition-transform"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- ═══ Header ═══ -->
    <div class="pt-[140px] pb-[60px] px-6 text-center bg-gradient-hero border-b border-glass-border">
        <h1 class="text-3xl md:text-5xl font-extrabold mb-4 text-gradient inline-block">Nossos Produtos</h1>
        <div class="flex items-center justify-center gap-3 text-sm text-text-secondary">
            <a href="index.html" class="hover:text-primary-light transition-colors">Home</a> <span
                class="text-text-muted">/</span> <span class="text-text-primary font-medium">Produtos</span>
        </div>
    </div>

    <!-- ═══ Shop Layout ═══ -->
    <main class="max-w-[1400px] mx-auto px-6 py-[60px] flex flex-col lg:flex-row gap-8 lg:gap-10 items-start">

        <button
            class="w-full lg:hidden bg-transparent border border-glass-border text-text-primary font-semibold py-3 px-6 rounded-xl hover:bg-card hover:border-primary transition-all flex items-center justify-center gap-2"
            id="filter-toggle">
            <i data-lucide="filter" class="w-5 h-5"></i> Mostrar Filtros
        </button>

        <aside class="w-full lg:w-[280px] shrink-0 lg:sticky lg:top-[100px] hidden lg:block" id="shop-sidebar">
            <!-- Category Filter -->
            <div class="bg-card border border-glass-border rounded-2xl p-6 mb-6 shadow-card">
                <h3 class="text-lg font-bold mb-4 text-text-primary flex items-center gap-3">
                    <span class="bg-primary/20 text-primary p-2 rounded-lg flex items-center justify-center"><i data-lucide="folder" class="w-4 h-4"></i></span> Categorias
                </h3>
                <div id="category-filters" class="flex flex-col gap-2">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <!-- Price Filter -->
            <div class="bg-card border border-glass-border rounded-2xl p-6 mb-6 shadow-card">
                <h3 class="text-lg font-bold mb-4 text-text-primary flex items-center gap-3">
                    <span class="bg-primary/20 text-primary p-2 rounded-lg flex items-center justify-center"><i data-lucide="coins" class="w-4 h-4"></i></span> Faixa de Preço
                </h3>
                <div class="flex items-center gap-3 mb-4">
                    <input type="number" id="min-price" placeholder="R$ Min"
                        class="w-full bg-dark border border-glass-border rounded-lg px-3 py-2.5 text-sm text-text-primary outline-none focus:border-primary transition-colors placeholder:text-text-muted">
                    <span class="text-text-muted">-</span>
                    <input type="number" id="max-price" placeholder="R$ Max"
                        class="w-full bg-dark border border-glass-border rounded-lg px-3 py-2.5 text-sm text-text-primary outline-none focus:border-primary transition-colors placeholder:text-text-muted">
                </div>
                <button
                    class="w-full bg-transparent border border-glass-border text-text-primary font-semibold py-2.5 px-4 rounded-lg hover:bg-dark hover:border-primary transition-all"
                    id="apply-price">
                    Aplicar Filtro
                </button>
            </div>

            <div class="rounded-2xl p-6 bg-gradient-primary text-black shadow-glow relative overflow-hidden group">
                <div
                    class="absolute -right-4 -top-4 opacity-10 group-hover:scale-110 transition-transform duration-500">
                    <i data-lucide="rocket" class="w-24 h-24"></i>
                </div>
                <h3 class="text-lg font-bold mb-3 flex items-center gap-2 relative z-10">Oferta Especial</h3>
                <p class="text-sm opacity-90 leading-relaxed mb-4 relative z-10">
                    Use o cupom <strong
                        class="text-accent-light font-black tracking-wider bg-black/20 px-2 py-0.5 rounded">NOVA20</strong>
                    no checkout e ganhe 20% OFF na primeira compra.
                </p>
            </div>
        </aside>

        <div class="flex-[1] w-full min-w-0">
            <div
                class="flex flex-col sm:flex-row items-center justify-between bg-card border border-glass-border rounded-2xl p-4 sm:px-6 mb-8 gap-4 shadow-card">
                <div class="text-text-secondary text-sm font-medium" id="results-count">
                    Carregando...
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto relative group">
                    <select
                        class="w-full sm:w-[220px] bg-dark border border-glass-border text-text-primary text-sm rounded-lg px-4 py-2.5 outline-none focus:border-primary appearance-none cursor-pointer transition-colors hover:border-text-muted"
                        id="sort-select">
                        <option value="">Ordenar por: Destaque</option>
                        <option value="price-asc">Menor Preço</option>
                        <option value="price-desc">Maior Preço</option>
                        <option value="rating">Melhor Avaliação</option>
                        <option value="name">Nome (A-Z)</option>
                    </select>
                    <!-- Custom Arrow for select -->
                    <div
                        class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-text-muted group-hover:text-text-primary transition-colors">
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6" id="products-grid">
                <!-- Rendered by JS -->
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
